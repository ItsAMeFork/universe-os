<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Universe OS vergrendelscherm (achtergrond voor swaylock), in de stijl van het planeet-inlogscherm.
       swaylock tekent de invoercirkel in het midden, bovenop de planeet. Alles belangrijks staat binnen de middelste
       1440 px, zodat het ook op 4:3-schermen zichtbaar blijft (swaylock met scaling fill snijdt dan de zijkanten af). -->
  <defs>
    <radialGradient id="n1" cx="23%" cy="29%" r="40%"><stop offset="0" stop-color="#6d4395" stop-opacity=".30"/><stop offset="1" stop-color="#6d4395" stop-opacity="0"/></radialGradient>
    <radialGradient id="n2" cx="73%" cy="68%" r="42%"><stop offset="0" stop-color="#155d72" stop-opacity=".38"/><stop offset="1" stop-color="#155d72" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset=".45" stop-color="#85ffe3" stop-opacity=".14"/><stop offset="1" stop-color="#85ffe3" stop-opacity="0"/></radialGradient>
    <radialGradient id="planet" cx="35%" cy="29%" r="78%"><stop offset="0" stop-color="#9fe9e4"/><stop offset=".40" stop-color="#2f7f86"/><stop offset=".75" stop-color="#0d3a45"/><stop offset="1" stop-color="#030714"/></radialGradient>
    <radialGradient id="shade" cx="72%" cy="74%" r="70%"><stop offset=".35" stop-color="#030714" stop-opacity="0"/><stop offset="1" stop-color="#030714" stop-opacity=".75"/></radialGradient>
    <clipPath id="disc"><circle cx="960" cy="540" r="250"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="#050815"/>
  <rect width="1920" height="1080" fill="url(#n1)"/>
  <rect width="1920" height="1080" fill="url(#n2)"/>
  <g fill="#d0e8ff">
    <circle cx="140" cy="96" r="1.6" opacity=".8"/><circle cx="312" cy="230" r="1.1" opacity=".6"/><circle cx="455" cy="70" r="1.3" opacity=".7"/>
    <circle cx="610" cy="180" r="0.9" opacity=".5"/><circle cx="1290" cy="120" r="1.4" opacity=".7"/><circle cx="1505" cy="260" r="1" opacity=".55"/>
    <circle cx="1720" cy="88" r="1.7" opacity=".85"/><circle cx="1830" cy="410" r="1.1" opacity=".6"/><circle cx="1610" cy="690" r="1.3" opacity=".65"/>
    <circle cx="1765" cy="930" r="1" opacity=".5"/><circle cx="1385" cy="980" r="1.5" opacity=".75"/><circle cx="560" cy="960" r="1.2" opacity=".6"/>
    <circle cx="250" cy="820" r="1.6" opacity=".8"/><circle cx="96" cy="560" r="1" opacity=".5"/><circle cx="380" cy="470" r="1.3" opacity=".65"/>
    <circle cx="1180" cy="40" r="1" opacity=".5"/><circle cx="760" cy="40" r="1.2" opacity=".6"/><circle cx="1490" cy="520" r="0.9" opacity=".45"/>
    <circle cx="430" cy="680" r="0.9" opacity=".45"/><circle cx="1050" cy="1040" r="1.1" opacity=".55"/><circle cx="1870" cy="640" r="1.4" opacity=".7"/>
  </g>
  <circle cx="960" cy="540" r="450" fill="url(#glow)"/>
  <circle cx="960" cy="540" r="250" fill="url(#planet)"/>
  <g clip-path="url(#disc)" fill="none" stroke="#baf7e8" stroke-opacity=".10">
    <path d="M700 470 C 820 440 1100 450 1220 480" stroke-width="16"/>
    <path d="M705 560 C 840 535 1080 545 1215 575" stroke-width="10"/>
    <path d="M730 650 C 850 630 1060 640 1190 665" stroke-width="12"/>
  </g>
  <circle cx="960" cy="540" r="250" fill="url(#shade)"/>
  <circle cx="960" cy="540" r="250" fill="none" stroke="#85ffe3" stroke-opacity=".35" stroke-width="2"/>
  <g font-family="Noto Sans, sans-serif" text-anchor="middle">
    <text x="960" y="215" font-size="58" font-weight="600" fill="#85ffe3" letter-spacing="2">Vergrendeld</text>
    <text x="960" y="880" font-size="26" fill="#e2e6fa">Typ je wachtwoord en druk op Enter.</text>
    <text x="960" y="922" font-size="21" fill="#869cae">Je programma's en open vensters blijven gewoon staan.</text>
  </g>
</svg>
