<!doctype html>
<!-- Maakt scripts/assets/vergrendeld.png (achtergrond van swaylock) met dezelfde aarde en ruimte als het inlogscherm
     en het 3D-bureaublad. Openen in een browser op 1920x1080 met deviceScaleFactor 4/3 (= 2560x1440) en een
     schermafbeelding maken; zie de uitleg in docs/tests/aarde-mappenbaan.md. swaylock tekent de invoercirkel in het
     midden, op de aarde. Belangrijke dingen binnen de middelste 1440 px (4:3-schermen snijden de zijkanten af). -->
<html lang="nl"><head><meta charset="utf-8"><title>Vergrendelscherm maken</title>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#050815;font-family:"Noto Sans","DejaVu Sans",sans-serif}
#nebula{position:absolute;inset:0;background:
 radial-gradient(ellipse 38% 46% at 88% 22%,#ff8a3d2e,transparent 70%),radial-gradient(ellipse 30% 34% at 96% 60%,#ff6a2a1c,transparent 70%),
 radial-gradient(ellipse 60% 22% at 40% 70%,#7a5cff1f,transparent 70%),radial-gradient(ellipse 45% 30% at 18% 28%,#3d6bff17,transparent 70%)}
#sky,#sky canvas{position:absolute;inset:0;width:1920px;height:1080px}
#glow{position:absolute;left:510px;top:90px;width:900px;height:900px;background:radial-gradient(circle,#6fb4ff1c,transparent 62%)}
#earth{position:absolute;left:635px;top:215px;width:650px;height:650px} /* = eindbeeld van de vergrendelanimatie (world.js closeView) */
#earth canvas{width:100%;height:100%}
h1,p{position:absolute;left:0;right:0;text-align:center;margin:0}
h1{top:118px;font-size:58px;font-weight:600;color:#85ffe3;letter-spacing:2px}
p.a{top:880px;font-size:26px;color:#e2e6fa}p.b{top:925px;font-size:21px;color:#869cae}
/* ?overgang maakt scripts/assets/overgang.png: het laatste beeld van het inlogscherm na de ontploffing (alleen de
   gedimde sterren, login.css #stars.fade). De sessie toont het meteen (swaybg) tot het 3D-bureaublad er is. */
.overgang #nebula,.overgang #glow,.overgang #earth,.overgang h1,.overgang p{display:none}.overgang #sky{opacity:.35}
</style></head><body>
<div id="nebula"></div><div id="sky"></div><div id="glow"></div><div id="earth"></div>
<h1>Vergrendeld</h1><p class="a">Typ je wachtwoord en druk op Enter.</p><p class="b">Je programma's en open vensters blijven gewoon staan.</p>
<script type="module">
import {earthNow} from '../../pakket/universe-os/usr/share/universe-os/ui/globe.js';
import {DEFAULT_CAM,distFor,drawSky} from '../../pakket/universe-os/usr/share/universe-os/ui/space.js';
if(location.search.includes('overgang'))document.body.classList.add('overgang');
const cam={...DEFAULT_CAM,dist:distFor(650)};
document.getElementById('sky').append(drawSky(document.createElement('canvas'),cam,1920,1080,4/3));
document.getElementById('earth').append(earthNow(800));
document.body.dataset.ready='1';
</script></body></html>
