# Universe OS: pakketlijsten verversen kort na het opstarten
# Samen met apt-daily-upgrade.timer zorgt dit ervoor dat updates niet alleen dagelijks draaien,
# maar ook 5 minuten na het opstarten. unattended-upgrades zelf installeert maximaal 1x per dag (APT::Periodic::Unattended-Upgrade "1").
[Timer]
OnBootSec=5min
