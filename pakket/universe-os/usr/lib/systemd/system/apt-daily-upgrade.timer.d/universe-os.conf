# Universe OS: updates installeren kort na het opstarten
# Samen met apt-daily.timer zorgt dit ervoor dat updates niet alleen dagelijks draaien,
# maar ook 15 minuten na het opstarten (na het verversen van pakketlijsten). unattended-upgrades zelf installeert maximaal 1x per dag (APT::Periodic::Unattended-Upgrade "1").
[Timer]
OnBootSec=15min
