<!doctype html>
<html lang="nl" style="background:#050815 url(../backgrounds/kern.png) center/cover"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universe OS — aanmelden</title><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="login.css"></head>
<body class="forming"><div id="core" aria-hidden="true"></div><main><div id="stars" aria-hidden="true"></div><div id="planet" aria-hidden="true"><div id="klok"><span id="klok-tijd"></span><span id="klok-datum"></span></div></div><nav id="users" aria-label="Gebruikers" hidden></nav><form id="kluis" hidden><label id="prompt-label"><span id="prompt-text" class="verborgen-tekst">Wachtwoord</span><input id="response" type="password" autocomplete="off" placeholder="Wachtwoord"></label><button id="submit" class="primary" type="submit" aria-label="Inloggen" title="Inloggen">&#x2192;</button><p id="message" role="status" aria-live="polite"></p></form></main><button id="other-user" type="button" hidden>Andere gebruiker</button><script type="module" src="login.js"></script><script>/* if the page script fails, the planets must still appear (after the start-up flight, which may run slower on a slow pc: at the latest 25 s) */const nood=()=>{const b=document.body;b.classList.remove("vlucht");document.getElementById("opstartvlucht")?.remove();if(!b.classList.contains("formed")){b.classList.remove("forming");b.classList.add("formed");document.getElementById("core")?.remove();document.documentElement.style.background="#050815";}};setTimeout(()=>document.body.classList.contains("vlucht")?setTimeout(nood,16000):nood(),9000);</script></body></html>
