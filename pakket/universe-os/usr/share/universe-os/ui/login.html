<!doctype html>
<html lang="nl" style="background:#050815 url(../backgrounds/kern.png) center/cover"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universe OS — aanmelden</title><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="login.css"></head>
<body class="forming"><div id="core" aria-hidden="true"></div><main><div id="stars" aria-hidden="true"></div><div id="planet" aria-hidden="true"></div><form id="login" class="glass"><h1>Universe OS</h1><p>Jouw toegang tot het universum</p><label>Gebruikersnaam<input id="user" type="text" autocomplete="username" required autofocus></label><label id="prompt-label" hidden><span id="prompt-text">Wachtwoord</span><input id="response" type="password" autocomplete="off"></label><p id="message" role="status" aria-live="polite"></p><button id="submit" class="primary" type="submit">Verder</button><button id="other-user" type="button" hidden>Andere gebruiker</button></form></main><script type="module" src="login.js"></script><script>/* if the page script fails, the form must still appear */setTimeout(()=>{const b=document.body;if(!b.classList.contains("formed")){b.classList.remove("forming");b.classList.add("formed");document.getElementById("core")?.remove();document.documentElement.style.background="#050815";}},9000);</script></body></html>
