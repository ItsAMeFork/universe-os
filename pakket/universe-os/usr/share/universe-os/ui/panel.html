<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Bedieningspaneel</title>
<link rel="stylesheet" href="common.css">
<style>
html,body{background:transparent;overflow:hidden}
.pill{position:absolute;top:4px;left:50%;translate:-50% 0;display:flex;align-items:center;gap:12px;height:34px;padding:0 14px;border-radius:20px;font-size:.88em;white-space:nowrap;background:#0b1021c9;border:1px solid var(--line);box-shadow:0 6px 18px #0008}
.pill .item{display:flex;align-items:center;gap:5px}
.pill .count{background:var(--accent-strong);color:#15323e;border-radius:10px;padding:0 6px;font-size:.8em;font-weight:700}
.pill:hover{border-color:#85ffe355}
.panel{position:absolute;inset:4px;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.panel[hidden],.pill[hidden]{display:none}
.top{display:flex;align-items:center;justify-content:space-between}
.clock{font-size:1.6em;font-weight:600;letter-spacing:.5px}
.date{color:var(--muted);font-size:.85em}
.card{background:#0b1021c9;border:1px solid var(--line);border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card .line{display:flex;align-items:center;gap:10px;justify-content:space-between}
.card .line>span{display:flex;align-items:center;gap:8px;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}
.power{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.power button,.quick button{display:flex;align-items:center;gap:8px;justify-content:center;padding:10px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.notes{display:flex;flex-direction:column;gap:6px}
.note{background:#0d1628;border-radius:10px;padding:8px 10px;font-size:.88em}
.note b{display:block}
.small{font-size:.8em;color:var(--muted)}
.confirm{display:flex;flex-direction:column;gap:8px}
.panel-heading{font-size:.85em;color:var(--accent);margin:4px 0 0;letter-spacing:.5px}
summary{cursor:pointer;padding:6px 0;font-weight:600}details>div{padding-top:10px}
.card select{max-width:100%;width:100%}.note,.card{overflow-wrap:anywhere}
</style>
</head>
<body>
<script src="load-guard.js" data-page="panel"></script>
<script type="module" src="panel.js"></script>
</body>
</html>
