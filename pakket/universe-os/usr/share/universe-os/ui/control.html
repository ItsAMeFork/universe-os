<!doctype html>
<html lang="nl" style="background:#050815">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controlecentrum</title><link rel="stylesheet" href="common.css"><style>
html,body{background:var(--space);overflow:hidden}main{display:grid;grid-template-columns:260px 1fr;height:100%}nav{padding:20px;overflow:auto;border-right:1px solid var(--line)}nav h1{font-size:1.3em;color:var(--accent)}nav button{width:100%;display:flex;gap:10px;text-align:left;margin:5px 0}nav button[aria-current=page]{border-color:var(--accent);color:var(--accent)}article{overflow:auto;padding:28px;min-width:0}h2,h3{color:var(--accent)}.card{padding:18px;margin:16px 0;border-radius:24px;background:#0b1021e6;border:1px solid var(--line)}label{display:flex;flex-direction:column;gap:8px;margin:12px 0}label.check{flex-direction:row;align-items:center}input,select,textarea{max-width:100%;min-width:0}button{margin:5px 5px 5px 0}.message{min-height:1.5em;overflow-wrap:anywhere}.message.error{color:var(--danger)}dl{display:grid;grid-template-columns:minmax(120px,30%) 1fr;gap:12px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}.secret{max-width:420px}.row{display:flex;gap:12px;flex-wrap:wrap}#search{width:100%}@media(max-width:760px){main{grid-template-columns:190px 1fr}nav,article{padding:12px}dl{grid-template-columns:1fr}}
</style></head><body><main><nav aria-label="Instellingen"><h1>Controlecentrum</h1><input id="search" type="search" placeholder="Zoek instellingen" aria-label="Zoek instellingen"><div id="pages"></div></nav><article id="content" aria-live="polite">Instellingen laden…</article></main><script type="module" src="control.js"></script></body></html>
