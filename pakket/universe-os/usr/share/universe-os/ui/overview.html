<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Overzicht en zoeken</title>
<link rel="stylesheet" href="common.css">
<style>
html,body{background:#03060fcc;overflow:hidden}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:7vh 5vw 4vh;gap:22px;overflow:auto;animation:fade .18s ease}
.search{position:relative;width:min(720px,100%)}
.search .icon{position:absolute;left:16px;top:50%;translate:0 -50%;color:var(--muted);width:22px;height:22px}
.search input{width:100%;font-size:1.25em;padding:15px 18px 15px 50px;border-radius:24px;background:#0b1021c9}
.block{width:min(1100px,100%)}
.block h2{margin:0 0 10px;font-size:.85em;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.windows{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.win{position:relative;display:flex;align-items:center;gap:12px;padding:14px;border-radius:24px;text-align:left;background:#0b1021c9;min-height:76px}
.win img,.win>.icon{width:40px;height:40px;flex:none;color:var(--accent)}
.win .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.win .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win .sub{font-size:.78em;color:var(--muted)}
.win.active{border-color:#85ffe366}
.win .x{position:absolute;right:6px;top:6px;padding:4px;border-radius:8px;background:transparent;border:0;color:var(--muted)}
.win .x:hover{color:#fff;background:#ff8a9a33}
.win{padding:0}.window-open{width:100%;min-height:76px;display:flex;gap:12px;align-items:center;text-align:left;padding:14px 42px 14px 14px;border:0;background:transparent}.window-open img,.window-open>.icon{width:40px;height:40px;flex:none}.win .x{padding:6px}.win .x:focus-visible{z-index:1}
.results{display:flex;flex-direction:column;gap:4px}
.res{display:flex;align-items:center;gap:12px;text-align:left;padding:9px 12px;border-radius:12px;background:#162335b3}
.res img,.res .icon{width:28px;height:28px;flex:none;color:var(--accent)}
.res .t{display:flex;flex-direction:column;min-width:0}
.res .sub{font-size:.78em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.planets{display:flex;gap:10px;flex-wrap:wrap}
.planets button{display:flex;align-items:center;gap:8px}
.empty{color:var(--muted)}
.foot{color:var(--muted);font-size:.8em;margin-top:auto}
.foot kbd{font-family:inherit;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--text)}
@keyframes fade{from{opacity:0}}
</style>
</head>
<body>
<script type="module" src="overview.js"></script>
</body>
</html>
