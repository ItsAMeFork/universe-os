<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Dock</title>
<link rel="stylesheet" href="common.css">
<style>
/* Dock (concept 10 Oct): a glass shelf at the bottom with fixed programs and open windows. Orange marks what is open
   (files/orbits colour), teal stays the focus colour of the system. No CSS filters or blur: cheap without a GPU. */
html,body{background:transparent;overflow:hidden}
.dock{position:absolute;left:50%;translate:-50% 0;width:max-content;bottom:0;height:64px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;
 border-radius:22px 22px 14px 14px;background:linear-gradient(#e8eeff2e,#c8d4f014 60%,#0b102199);border:1px solid #e8eeff40;border-bottom-color:#e8eeff18;
 box-shadow:0 10px 30px #000a,inset 0 1px 0 #ffffff40}
.dock .sep{width:1px;height:34px;background:#e8eeff33;margin:0 4px}
.item{position:relative;width:52px;height:52px;padding:0;display:grid;place-items:center;border:0;border-radius:14px;background:none}
.item:hover{background:#ffffff1c}
.item img{width:38px;height:38px;object-fit:contain;transition:transform .15s}
.item .icon{width:30px;height:30px;color:var(--text)}
.item:hover img,.item:hover .icon{transform:translateY(-2px)}
.item.home .icon{width:34px;height:34px;color:#ffa552}
.item .dot{position:absolute;bottom:2px;left:50%;translate:-50% 0;width:6px;height:6px;border-radius:50%;background:#ffa552;display:none}
.item.open .dot{display:block}
.item.active .dot{width:16px;border-radius:3px}
.item.dragging{z-index:2;opacity:.85}
.ctx{position:absolute;z-index:5;min-width:200px;padding:6px;border-radius:14px;display:flex;flex-direction:column;gap:2px;background:#0b1021f2;border:1px solid var(--line);box-shadow:0 10px 30px #000a}
.ctx button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:9px;white-space:nowrap}
.ctx button:hover,.ctx button:focus-visible{background:#ffffff14}

/* Start button: the Universe planet with its teal ring. */
.start-button svg{width:34px;height:34px}
.start-button.active{background:#ffffff1f}
/* Start menu (like Windows 11, in the concept style): dark glass, orange nebula glow, teal focus. */
.start-menu{position:absolute;left:50%;bottom:72px;translate:-50% 0;width:640px;max-height:var(--start-max,640px);display:flex;flex-direction:column;gap:14px;
 padding:22px 26px 0;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,#141a35f5,#0b1021f7 55%,#120d1ef7);border:1px solid #e8eeff2e;
 box-shadow:0 20px 60px #000c,inset 0 1px 0 #ffffff26;animation:start-in .16s ease-out}
.start-glow{position:absolute;right:-90px;top:-120px;width:320px;height:320px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#ff8a3d3a,transparent 65%)}
.start-search{width:100%;padding:11px 16px;border-radius:22px;background:#0b1021;border:1px solid #e8eeff2e;position:relative}
.start-body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;position:relative;padding-bottom:10px}
.start-head{display:flex;align-items:center;justify-content:space-between}
.start-body h2{margin:6px 0 2px;font-size:.92em;font-weight:600;color:var(--accent)}
.start-body .link{border:0;background:#ffffff12;padding:5px 12px;border-radius:8px;font-size:.85em}
.start-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.start-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:0;border-radius:10px;background:none;font-size:.8em;text-align:center}
.start-tile img,.start-tile .icon{width:36px;height:36px;object-fit:contain}
.start-tile span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}
.start-tile:hover,.start-row:hover,.start-place:hover,.start-user:hover,.start-icon:hover{background:#ffffff14}
.start-list{display:flex;flex-direction:column;gap:1px}
.start-row{display:flex;align-items:center;gap:12px;padding:7px 10px;border:0;border-radius:8px;background:none;text-align:left}
.start-row img,.start-row .icon{width:26px;height:26px;object-fit:contain;flex:none}
.letter{padding:10px 10px 2px;color:var(--accent);font-weight:600;font-size:.85em}
.start-places{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.start-place{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #e8eeff1a;border-radius:10px;background:#ffffff08;font-size:.86em}
.start-place .icon{color:#ffa552}
.start-foot{display:flex;align-items:center;gap:6px;margin:0 -26px;padding:10px 20px;background:#0000004d;border-top:1px solid #e8eeff1a;position:relative}
.start-foot .grow{flex:1}
.start-user{display:flex;align-items:center;gap:10px;border:0;background:none;padding:6px 10px;border-radius:10px}
.start-user .avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:hsl(182 50% 30%);color:#dffef6}
.start-icon{border:0;background:none;padding:9px;border-radius:10px;display:grid;place-items:center}
.start-icon .icon{width:20px;height:20px}
@keyframes start-in{from{opacity:0;transform:translateY(12px)}}
@media(prefers-reduced-motion:reduce){.start-menu{animation:none}}
html.reduce-motion .start-menu,html.no-motion .start-menu{animation:none}
.ctx{z-index:20}
</style>
</head>
<body>
<script src="load-guard.js" data-page="dock"></script>
<script type="module" src="dock.js"></script>
</body>
</html>
