# Universe OS: standaardsessie en inlogscherm. Automatische aanmelding staat uit; alleen live-config zet die
# in de live-sessie aan voor het tijdelijke live-account (niet in het geïnstalleerde systeem).
[Seat:*]
greeter-session=universe-greeter
user-session=universe
autologin-session=universe
greeter-hide-users=false
greeter-show-manual-login=true
greeter-allow-guest=false
allow-guest=false
pam-service=lightdm
autologin-guest=false
