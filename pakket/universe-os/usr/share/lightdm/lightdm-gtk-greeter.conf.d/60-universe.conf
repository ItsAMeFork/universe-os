# Inlogscherm in Universe-stijl (taal volgt de systeemtaal, standaard Nederlands).
[greeter]
background=/usr/share/universe-os/backgrounds/ruimte.svg
theme-name=Adwaita-dark
icon-theme-name=Adwaita
font-name=Noto Sans 11
indicators=~host;~spacer;~clock;~spacer;~layout;~language;~session;~a11y;~power
clock-format=%A %e %B  %H:%M
position=50%,center 50%,center
user-background=false
hide-user-image=false
a11y-states=
