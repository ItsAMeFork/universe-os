# Universe OS: rustig opstarten zonder zichtbaar GRUB-menu. Gelezen door update-grub/grub-mkconfig.
# Herstelroute: houd Esc (of Shift) ingedrukt direct na het fabrieks-/firmwarelogo, dan verschijnt het menu
# met "Advanced options" (herstelmodus). Andere besturingssystemen blijven via het opstartmenu van de firmware bereikbaar.
GRUB_DISTRIBUTOR="Universe OS"
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=1
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3 vt.global_cursor_default=0"
GRUB_GFXPAYLOAD_LINUX=keep
