# Universe OS (0.2.23): NVIDIA-kaarten krijgen niet vanzelf een stuurprogramma. Anders laden nouveau en nvidia door
# elkaar, of blokkeert het NVIDIA-pakket nouveau ook op kaarten die nvidia 550 niet kent. universe-gpu.service kiest
# bij het opstarten één van de twee (zie /usr/lib/universe-os/universe-gpu). "blacklist" houdt alleen het automatisch
# laden tegen; modprobe met de naam werkt gewoon.
blacklist nouveau
blacklist nvidia
blacklist nvidia-drm
blacklist nvidia-modeset
blacklist nvidia-current
blacklist nvidia-current-drm
blacklist nvidia-current-modeset
# Nodig voor Wayland (labwc) en een /dev/dri-kaart, waar grafisch.py naar kijkt.
options nvidia-drm modeset=1 fbdev=1
options nvidia-current-drm modeset=1 fbdev=1
