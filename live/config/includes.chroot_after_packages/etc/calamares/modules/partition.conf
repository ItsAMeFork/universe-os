---
# Universe OS 0.1: getest is alleen installeren op een (lege) schijf met "Schijf wissen".
# Handmatig partitioneren is uitgeschakeld. "Naast een bestaand systeem" en "Vervangen" toont Calamares alleen als er
# al een besturingssysteem op de schijf staat; die keuzes zijn NIET getest (zie docs/tests/).
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"
requiredPartitionTableType: gpt
userSwapChoices:
    - none
    - file
initialSwapChoice: file
# Niets vooraf aangevinkt: de gebruiker moet zelf "Schijf wissen" kiezen.
initialPartitioningChoice: none
allowManualPartitioning: false
drawNestedPartitions: false
alwaysShowPartitionLabels: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4"]
essentialMounts: [ "live-*", "control", "ventoy" ]
showNotEncryptedBootMessage: false
# Geen versleuteling: cryptsetup zit niet in het ISO en dit is niet getest.
enableLuksAutomatedPartitioning: false
lvm:
    enable: false
