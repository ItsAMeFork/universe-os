---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: true
# Lees de huidige indeling via systemd-localed: setxkbmap bestaat niet in de Wayland-sessie
# (anders toont Calamares "A user-defined custom Layout").
useLocale1: true
# Standaard blijft de indeling van de live-omgeving: Verenigde Staten Internationaal (QWERTY).
# Nederlands en andere indelingen zijn in de lijst te kiezen.
guessLayout: false
configure:
    kwin: false
    gnome: false
