---
efiBootLoader: "grub"
kernel: "/vmlinuz"
img: "/initrd.img"
# Zelfde wachttijd als het live-opstartmenu (8 seconden).
timeout: "8"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
# Map "debian" op de EFI-partitie: daar zoekt Debians ondertekende grub (shim, Secure Boot) zijn configuratie.
efiBootloaderId: "debian"
# Ook EFI/BOOT/BOOTX64.EFI, zodat firmware zonder opgeslagen opstartvermelding (zoals veel VM's) toch opstart.
installEFIFallback: true
