---
# Live-onderdelen en de installer horen niet in het geïnstalleerde systeem. Offline: geen apt-get update.
backend: apt
skip_if_no_internet: false
update_db: false
update_system: false
operations:
  - try_remove:
      - live-boot
      - live-boot-initramfs-tools
      - live-config
      - live-config-systemd
      - live-tools
      - calamares
