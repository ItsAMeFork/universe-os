---
# Laatste stappen in het geïnstalleerde systeem.
dontChroot: false
timeout: 300
script:
    # Officiële Debian-pakketbronnen (ook beveiligingsupdates).
    - "printf 'deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware\\ndeb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware\\ndeb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware\\n' > /etc/apt/sources.list"
    - "rm -f /etc/apt/sources.list.d/*live* /etc/sudoers.d/live /etc/lightdm/lightdm.conf.d/*autologin* || true"
    # Geen live-installer-snelkoppeling of Calamares-configuratie in het geïnstalleerde systeem.
    - "rm -rf /etc/calamares /usr/share/applications/universe-install.desktop"
    # Persoonlijke mappen privé.
    - "-sh -c 'for h in /home/*; do [ -d \"$h\" ] && chmod 0700 \"$h\"; done'"
    - "-systemctl enable ufw.service"
