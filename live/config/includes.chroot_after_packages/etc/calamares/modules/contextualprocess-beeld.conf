# 0.2.31: keuze van de stap 'Beeld' (packagechooser@beeld) vastleggen in het geïnstalleerde systeem.
# licht: /etc/universe-os/grafisch-licht (lichte modus vanaf de eerste start).
# normaal: /etc/universe-os/grafisch-normaal (geen automatische lichte modus; na een crash gaat hij nog steeds licht).
# Controlecentrum > Vormgeving > Lichte grafische modus wint per gebruiker van beide bestanden.
dontChroot: false
timeout: 30
packagechooser_beeld:
    licht:
        - "install -d /etc/universe-os"
        - "rm -f /etc/universe-os/grafisch-normaal"
        - "touch /etc/universe-os/grafisch-licht"
    normaal:
        - "install -d /etc/universe-os"
        - "rm -f /etc/universe-os/grafisch-licht"
        - "touch /etc/universe-os/grafisch-normaal"
    "*":
        - "true"
