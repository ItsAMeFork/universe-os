# 0.2.32: geen keuzescherm. De installer herkent de videokaart zelf (zelfde detectie als de live-sessie,
# grafisch.detect_light) en zet /etc/universe-os/grafisch-licht of grafisch-normaal op de doelschijf.
# Handmatig wijzigen kan alleen in Controlecentrum > Vormgeving > Lichte grafische modus.
dontChroot: true
timeout: 60
script:
    - "-/usr/lib/universe-os/universe-beeld-keuze ${ROOT}"
