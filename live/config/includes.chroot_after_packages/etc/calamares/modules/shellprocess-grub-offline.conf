---
# Installeert GRUB vanaf het live-medium (klaargezet door hook 0200), zonder internet: grub-efi-amd64 op een
# UEFI-computer, grub-pc op een computer met het oude BIOS (Legacy/CSM).
dontChroot: false
timeout: 300
script:
    - command: "if [ -d /sys/firmware/efi ]; then d=efi; else d=bios; fi; DEBIAN_FRONTEND=noninteractive dpkg -i /usr/share/universe-os/offline/$d/*.deb"
      timeout: 300
    - "rm -rf /usr/share/universe-os/offline"
