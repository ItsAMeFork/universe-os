---
# Installeert GRUB vanaf het live-medium (klaargezet door hook 0200), zonder internet: grub-efi-amd64 op een
# UEFI-computer, grub-pc op een computer met het oude BIOS (Legacy/CSM). /sys is in het doelsysteem gekoppeld
# (mount.conf), dus /sys/firmware/efi bestaat alleen als de computer met UEFI is opgestart.
# Geen shellvariabelen ($naam): Calamares ziet die als eigen variabelen en weigert dan de hele stap
# ("Missing variables are: d", Axel 12 okt). Daarom per firmware een eigen regel; elke regel slaagt alleen als
# hij niet van toepassing is of als dpkg slaagt.
dontChroot: false
timeout: 300
script:
    - command: "[ -d /sys/firmware/efi ] && DEBIAN_FRONTEND=noninteractive dpkg -i /usr/share/universe-os/offline/efi/*.deb || [ ! -d /sys/firmware/efi ]"
      timeout: 300
    - command: "[ ! -d /sys/firmware/efi ] && DEBIAN_FRONTEND=noninteractive dpkg -i /usr/share/universe-os/offline/bios/*.deb || [ -d /sys/firmware/efi ]"
      timeout: 300
    - "rm -rf /usr/share/universe-os/offline"
