// Universe OS ISO build (13 Oct): apt in the build chroot grew to 5.7 GB while downloading the package list and was
// killed (out of memory), the second time after network trouble. Only IPv4 (the VM's user network has no working
// IPv6, deb.debian.org answers with IPv6 first), no HTTP pipelining, patient retries.
Acquire::ForceIPv4 "true";
Acquire::http::Pipeline-Depth "0";
Acquire::Retries "5";
Acquire::http::Timeout "60";
