include menu.cfg
default vesamenu.c32
prompt 0

# Automatisch starten na 3 seconden (timeout is in tienden van seconden).
timeout 30

# Nederlandse helpteksten: onderin het menu en tijdens het aftellen.
menu tabmsg Enter: starten   -   Tab: opstartopties bewerken
menu autoboot Start automatisch over # seconde{,n}
