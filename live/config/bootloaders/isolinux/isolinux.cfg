include menu.cfg
default vesamenu.c32
prompt 0

# Automatisch starten na 8 seconden (timeout is in tienden van seconden).
timeout 80

# Nederlandse helpteksten: onderin het menu en tijdens het aftellen.
menu tabmsg Druk op Enter om te starten of op Tab om de opstartopties te bewerken
menu autoboot Universe OS start automatisch over # seconde{,n}. Druk op een toets om te stoppen.
