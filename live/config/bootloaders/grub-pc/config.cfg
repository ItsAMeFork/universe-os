# Universe OS 0.2.33: gebaseerd op live-build's config.cfg; hogere resolutie (thema schaalt mee), geen piep.
set default=0

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=1920x1080,1600x900,1366x768,1280x800,1280x720,1024x768,800x600,auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm
