source /boot/grub/config.cfg

# Universe OS: standaardstart en keuzes voor het beeld. Zie docs/stuurprogrammas.md.
# Labels moeten gelijk blijven aan live/config/bootloaders/syslinux_common/live.cfg.in.
# Automatisch starten: na 8 seconden start de eerste optie (Universe OS), tenzij een toets wordt ingedrukt.
set default=0
set timeout=8

menuentry "Universe OS" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}
menuentry "Universe OS - NVIDIA-stuurprogramma (nieuwere GeForce/RTX)" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ universe.gpu=nvidia
	initrd	@INITRD_LIVE@
}
menuentry "Universe OS - veilige grafische modus" {
	set gfxpayload=keep
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ universe.gpu=veilig universe.gfx=safe
	initrd	@INITRD_LIVE@
}
menuentry "Universe OS - nomodeset (noodgeval)" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset universe.gpu=veilig universe.gfx=safe
	initrd	@INITRD_LIVE@
}

# Installer (if any)
if @ENABLE_INSTALL_MENU@; then

source	/boot/grub/install_start.cfg

submenu 'Advanced install options ...' --hotkey=a {

	source /boot/grub/theme.cfg

	source	/boot/grub/install.cfg

}
fi

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
