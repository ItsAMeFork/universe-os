source /boot/grub/config.cfg

# Nederlandse GRUB-teksten (aftelmelding en toetshulp). De vertaling staat in /boot/grub/locale/nl.mo,
# die hook live/config/hooks/live/0400-grub-nl.hook.binary op de image zet. Zonder die module of vertaling blijft GRUB Engels.
if insmod gettext; then
	set lang=nl
fi

# Universe OS 0.2.32: één opstartoptie. Beeld (lichte modus, nvidia/nouveau, veilig) regelt zich automatisch.
# Met 'e' kan de kernelregel nog worden aangepast (bijv. universe.gfx=licht, universe.world=lite, nomodeset).
# Label gelijk aan live/config/bootloaders/syslinux_common/live.cfg.in. Na 3 seconden start hij vanzelf.
set default=0
set timeout=3

menuentry "Universe OS" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}
